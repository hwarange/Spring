spring.application.name=Spring_09_DynamicQuery

# JSP ViewResolver
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# DataSource (MySQL)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/ssafydb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=ssafy
spring.datasource.password=ssafy

# MyBatis: 매퍼 XML 위치
mybatis.mapper-locations=classpath:mappers/*.xml

# MyBatis: typeAlias - DTO 패키지 스캔 → 클래스명만으로 사용 가능
mybatis.type-aliases-package=com.ssafy.mvc.model.dto

# MyBatis: snake_case(컬럼) ↔ camelCase(필드) 자동 매핑
mybatis.configuration.map-underscore-to-camel-case=true

# 트랜잭션 디버깅용 로그 (롤백 시연 시 콘솔에서 확인)
logging.level.org.springframework.transaction=DEBUG
logging.level.org.springframework.jdbc.datasource=DEBUG
